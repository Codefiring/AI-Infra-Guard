# MCP Server Target Configuration
# List of MCP server URLs to scan with names

targets:
  # Format: name and url for each target
  # The name will be used in log file naming to identify the server
  - name: "MCP01"
    url: "http://127.0.0.1:8090"

  - name: "MCP02"
    url: "http://192.168.1.101:8080"

  - name: "MCP03"
    url: "http://10.0.0.50:9000"

  # You can also use domain names
  # - name: "PROD-API"
  #   url: "https://mcp-server.example.com:8080"
