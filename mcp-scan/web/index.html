<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Security Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-body:    #0d0d10;
    --bg-sidebar: #111115;
    --bg-card:    #18181f;
    --bg-card2:   #141419;
    --border:     rgba(255,255,255,0.07);
    --border-hl:  rgba(255,255,255,0.14);
    --text-main:  #f1f1f3;
    --text-muted: #6b7280;
    --blue:       #3b82f6;
    --green:      #34d399;
    --amber:      #fbbf24;
    --red:        #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-body);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* ── Cards ── */
  .card {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-card2));
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    border-radius: 12px;
  }
  .card-inner {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  /* ── Inputs ── */
  input[type=text], input[type=url], input[type=password], textarea, select {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: rgba(59,130,246,0.5);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }
  select option { background: #1e1e28; }
  textarea { resize: vertical; }

  /* ── Buttons ── */
  .btn-primary {
    background: linear-gradient(to right, #3b82f6, #34d399);
    box-shadow: 0 0 20px rgba(59,130,246,0.3);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .btn-primary:hover { opacity: 0.9; box-shadow: 0 0 28px rgba(59,130,246,0.45); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-hl);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
  .btn-danger {
    background: rgba(248,113,113,0.12);
    border: 1px solid rgba(248,113,113,0.25);
    color: var(--red);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-danger:hover { background: rgba(248,113,113,0.22); }
  .btn-icon {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

  /* ── Gradient text ── */
  .gradient-text {
    background: linear-gradient(135deg, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Collapsible panels ── */
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .panel-header:hover { background: rgba(255,255,255,0.03); }
  .panel-content { padding: 0 16px 16px; }
  .panel-arrow { transition: transform 0.2s; font-size: 10px; color: var(--text-muted); }
  .panel-arrow.open { transform: rotate(90deg); }

  /* ── Stage progress cards ── */
  .stage-card {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
  }
  .stage-card:hover { background: rgba(255,255,255,0.04); }
  .stage-card.active { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); }
  .stage-card.running {
    background: rgba(59,130,246,0.06);
    border-left: 2px solid var(--blue);
    box-shadow: -4px 0 12px rgba(59,130,246,0.15);
    animation: pulse-glow 2s infinite;
  }
  .stage-card.completed .stage-icon { color: var(--green); }
  .stage-card.running .stage-icon { color: var(--blue); }
  .stage-card.error .stage-icon { color: var(--red); }
  .stage-card.pending .stage-icon { color: var(--text-muted); }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: -4px 0 12px rgba(59,130,246,0.15); }
    50%       { box-shadow: -4px 0 20px rgba(59,130,246,0.35); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }

  /* ── Sidebar task items ── */
  .task-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    margin-bottom: 4px;
  }
  .task-item:hover { background: rgba(255,255,255,0.04); }
  .task-item.selected { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); }

  /* ── Status dots ── */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-running { background: var(--blue); box-shadow: 0 0 6px var(--blue); animation: pulse-glow 1.5s infinite; }
  .dot-completed { background: var(--green); }
  .dot-failed { background: var(--red); }
  .dot-pending { background: var(--text-muted); }

  /* ── Severity badges ── */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-high   { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .badge-medium { background: rgba(251,191,36,0.12);  color: var(--amber); border: 1px solid rgba(251,191,36,0.25); }
  .badge-low    { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.25); }
  .badge-count  { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); font-size: 11px; padding: 1px 7px; border-radius: 10px; }

  /* ── Checkbox ── */
  input[type=checkbox] {
    width: 14px; height: 14px; border-radius: 3px; cursor: pointer;
    accent-color: var(--blue);
  }

  /* ── Markdown body ── */
  .markdown-body { font-size: 13px; line-height: 1.7; color: var(--text-main); }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #c7d2fe; font-weight: 600; margin: 1em 0 0.5em; }
  .markdown-body h1 { font-size: 1.25em; }
  .markdown-body h2 { font-size: 1.1em; }
  .markdown-body h3 { font-size: 1em; }
  .markdown-body p { margin: 0.5em 0; }
  .markdown-body code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .markdown-body pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0.8em 0; }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border-hl); padding: 6px 10px; font-size: 12px; }
  .markdown-body th { background: rgba(255,255,255,0.05); font-weight: 600; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0.5em 0; }
  .markdown-body li { margin: 0.2em 0; }
  .markdown-body blockquote { border-left: 3px solid var(--blue); padding-left: 12px; color: var(--text-muted); margin: 0.8em 0; }
  .markdown-body a { color: #60a5fa; text-decoration: underline; }

  /* ── Progress bar ── */
  .progress-bar-track { background: rgba(255,255,255,0.06); border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(to right, #3b82f6, #34d399);
    transition: width 0.5s ease;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  .progress-bar-fill::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }
  .progress-bar-fill { position: relative; overflow: hidden; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: linear-gradient(135deg, #1a1a24, #14141c);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    border-radius: 16px;
    width: 560px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }

  /* ── Vuln accordion ── */
  .vuln-row { border-bottom: 1px solid var(--border); }
  .vuln-row:last-child { border-bottom: none; }
  .vuln-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
  .vuln-body { padding: 0 0 12px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  /* ── Target tabs (batch scan) ── */
  .target-tab {
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-muted);
    transition: all 0.15s; white-space: nowrap;
  }
  .target-tab.active {
    background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4);
    color: #93c5fd;
  }
  .target-tab:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text-main); }

  /* ── Lock row for always-on stages ── */
  .stage-locked {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    color: var(--text-muted); font-size: 12px;
  }

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

  /* ── Score gauge colors ── */
  .score-high   { stroke: var(--green);  fill: var(--green);  }
  .score-medium { stroke: var(--amber);  fill: var(--amber);  }
  .score-low    { stroke: var(--red);    fill: var(--red);    }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ HEADER ════════════════════════════════════ -->
<header style="background: linear-gradient(135deg, #111115, #0f0f18); border-bottom: 1px solid var(--border); flex-shrink: 0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;">
  <div style="display:flex;align-items:center;gap:12px;">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="13" stroke="url(#g1)" stroke-width="2"/>
      <path d="M8 14 L12 10 L16 14 L20 10" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="14" cy="18" r="3" fill="url(#g1)"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="28" y2="28">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#34d399"/>
        </linearGradient>
      </defs>
    </svg>
    <span class="gradient-text" style="font-size:17px;font-weight:700;letter-spacing:-0.3px;">MCP Security Scanner</span>
  </div>
  <div style="font-size:12px;color:var(--text-muted);">AI-Infra-Guard · mcp-scan</div>
</header>

<!-- ═══════════════════════════════════════ BODY ══════════════════════════════════════ -->
<div style="display:flex;flex:1;overflow:hidden;">

  <!-- ─────────────────── SIDEBAR ─────────────────── -->
  <aside id="sidebar" style="width:240px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;padding:14px 10px 10px;"></aside>

  <!-- ─────────────────── MAIN PANEL ─────────────────── -->
  <main id="main-panel" style="flex:1;overflow-y:auto;padding:20px 24px;"></main>
</div>

<!-- ═══════════════════════════════════════ LLM MODAL ════════════════════════════════ -->
<div id="llm-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeLlmModal()">
  <div class="modal-card" id="llm-modal-card"></div>
</div>

<!-- hidden file input for config import -->
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImportFile(event)">

<script>
// ═══════════════════════════════════════════════════════════════
//  STAGE CATALOGUE
// ═══════════════════════════════════════════════════════════════
const ALL_STAGES = [
  { id:  2, name: "Tool Poisoning (TPA)",          category: "malicious" },
  { id:  3, name: "Full Schema Poisoning (FSP)",   category: "malicious" },
  { id:  4, name: "Advanced Tool Poisoning (ATPA)",category: "malicious" },
  { id:  5, name: "Rug Pull",                      category: "malicious" },
  { id:  7, name: "Tool Name Spoofing",            category: "malicious" },
  { id:  8, name: "Tool Shadowing",                category: "malicious" },
  { id: 14, name: "Unauthenticated Access",        category: "malicious" },
  { id: 18, name: "Path Traversal",               category: "malicious" },
  { id: 21, name: "Privilege Abuse",              category: "malicious" },
  { id:  9, name: "Resource Content Poisoning",   category: "vuln"      },
  { id: 11, name: "Prompt Injection",             category: "vuln"      },
  { id: 12, name: "Command Injection",            category: "vuln"      },
  { id: 13, name: "Remote Code Execution (RCE)",  category: "vuln"      },
  { id: 16, name: "Token/Credential Theft",       category: "vuln"      },
  { id: 23, name: "SQL Injection",                category: "vuln"      },
];
const ALL_STAGE_IDS = ALL_STAGES.map(s => s.id);
const STAGE_MAP = Object.fromEntries(ALL_STAGES.map(s => [s.id, s]));
STAGE_MAP[1]  = { id:1,  name:"Info Collection",     category:"always" };
STAGE_MAP[27] = { id:27, name:"Vulnerability Review", category:"always" };

// ═══════════════════════════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════════════════════════
const AppState = {
  tasks: [],
  llmProfiles: [],
  selectedTaskId: null,
  selectedTargetIdx: 0,
  selectedStageId: null,
  showLlmModal: false,
  editingProfileId: null,
  taskSearchQuery: "",
  expandedVulns: new Set(),
  configForm: {
    targets: [
      { name: "", url: "", stage_ids: [...ALL_STAGE_IDS], stagesOpen: false }
    ],
    prompt: "", language: "zh",
    oauth_client_id: "", oauth_client_secret: "",
    oauth_token_url: "", oauth_scope: "",
  },
  llmForm: {
    name: "", base_url: "https://openrouter.ai/api/v1",
    api_key: "", model: "", is_default: false,
  },
  // UI collapse state
  panelOpen: { targets: true, oauth: false, prompt: false },
  llmFormOpen: false,
  // SSE
  eventSource: null,
};

// ── Mock data for Phase 1 standalone testing ──
function initMockData() {
  const stages17 = buildStageList([2,3,5,14,18,9,11,12,13,16,23]);
  stages17.forEach((s,i) => {
    if (i < 4) s.status = "completed", s.output = `## Stage ${s.stage_id} Output\n\nNo vulnerabilities detected in this stage.\n\n\`\`\`json\n{"result":"clean"}\n\`\`\``;
    else if (i === 4) s.status = "running";
  });

  AppState.tasks = [
    {
      id: "task-demo-1",
      status: "running",
      created_at: new Date(Date.now() - 180000).toISOString(),
      completed_at: null,
      llm_profile_name: "DeepSeek V3",
      llm_model: "deepseek/deepseek-v3",
      prompt: "",
      language: "zh",
      has_oauth: false,
      current_target_idx: 0,
      error: null,
      targets: [
        {
          id: "tt-1a",
          position: 0,
          name: "MCP Test",
          url: "http://192.168.1.10:8080/sse",
          stage_ids: [2,3,5,14,18,9,11,12,13,16,23],
          status: "running",
          score: null, readme: null,
          stages: stages17,
          vulnerabilities: []
        }
      ]
    },
    {
      id: "task-demo-2",
      status: "completed",
      created_at: new Date(Date.now() - 3600000).toISOString(),
      completed_at: new Date(Date.now() - 3000000).toISOString(),
      llm_profile_name: "DeepSeek V3",
      llm_model: "deepseek/deepseek-v3",
      prompt: "重点检测路径穿越漏洞",
      language: "zh",
      has_oauth: false,
      current_target_idx: 0,
      error: null,
      targets: [
        {
          id: "tt-2a",
          position: 0,
          name: "MCP Prod",
          url: "http://10.0.0.5:9090/sse",
          stage_ids: [...ALL_STAGE_IDS],
          status: "completed",
          score: 42,
          readme: "## MCP Server Info\n\n- **Server**: FastMCP v1.2\n- **Tools**: 8 registered\n- **Language**: Python\n\n### Tool List\n| Tool | Description |\n|------|-------------|\n| read_file | Read local files |\n| execute_cmd | Run shell commands |\n| fetch_url | HTTP requests |\n",
          stages: buildStageList([...ALL_STAGE_IDS]).map(s => ({ ...s, status: "completed", output: `## ${STAGE_MAP[s.stage_id]?.name || 'Stage'}\n\nAnalysis complete.` })),
          vulnerabilities: [
            { id:"v1", title:"Path Traversal via read_file", risk_type:"MCP18", level:"High",
              description:"The `read_file` tool accepts unsanitized path inputs allowing an attacker to read arbitrary files outside the intended directory.", suggestion:"Validate and sanitize all path inputs. Use `os.path.abspath()` and check it starts with the allowed root." },
            { id:"v2", title:"Unauthenticated Access to Admin Tools", risk_type:"MCP14", level:"Medium",
              description:"Admin-level tools are accessible without authentication tokens.", suggestion:"Implement bearer token validation for all sensitive tool calls." },
            { id:"v3", title:"SQL Injection in query_db tool", risk_type:"MCP23", level:"High",
              description:"User-supplied input is directly concatenated into SQL queries.", suggestion:"Use parameterized queries or an ORM." },
          ]
        }
      ]
    },
    {
      id: "task-demo-3",
      status: "failed",
      created_at: new Date(Date.now() - 7200000).toISOString(),
      completed_at: null,
      llm_profile_name: "DeepSeek V3",
      llm_model: "deepseek/deepseek-v3",
      prompt: "",
      language: "en",
      has_oauth: false,
      current_target_idx: 0,
      error: "Connection refused: http://192.168.1.99:8080/sse",
      targets: [
        { id:"tt-3a", position:0, name:"MCP Dev", url:"http://192.168.1.99:8080/sse",
          stage_ids: [...ALL_STAGE_IDS], status:"failed", score:null, readme:null,
          stages: buildStageList([...ALL_STAGE_IDS]), vulnerabilities:[] }
      ]
    }
  ];

  AppState.llmProfiles = [
    { id:"llm-1", name:"DeepSeek V3", base_url:"https://api.deepseek.com/v1", model:"deepseek/deepseek-v3", is_default:true, created_at:"2026-04-01T10:00:00" },
    { id:"llm-2", name:"OpenRouter Claude", base_url:"https://openrouter.ai/api/v1", model:"anthropic/claude-sonnet-4-6", is_default:false, created_at:"2026-04-02T10:00:00" },
  ];
  AppState.selectedLlmProfileId = "llm-1";
  AppState.selectedTaskId = "task-demo-1";
  AppState.selectedTargetIdx = 0;
  AppState.selectedStageId = null;
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function buildStageList(stageIds) {
  const ids = stageIds || ALL_STAGE_IDS;
  const sorted = [...ids].filter(i => i >= 2 && i <= 26).sort((a,b) => a-b);
  const list = [
    { stage_id:1,  name:"Info Collection",     status:"pending", output:"" },
    ...sorted.map(id => ({
      stage_id: id,
      name: STAGE_MAP[id]?.name || `Stage ${id}`,
      status: "pending",
      output: ""
    })),
    { stage_id:27, name:"Vulnerability Review", status:"pending", output:"" },
  ];
  return list;
}

function scoreColor(score) {
  if (score === null || score === undefined) return "var(--text-muted)";
  if (score >= 70) return "var(--green)";
  if (score >= 40) return "var(--amber)";
  return "var(--red)";
}

function levelBadge(level) {
  const l = (level||"").toLowerCase();
  if (l.includes("high") || l.includes("高")) return `<span class="badge badge-high">${level}</span>`;
  if (l.includes("med")  || l.includes("中")) return `<span class="badge badge-medium">${level}</span>`;
  return `<span class="badge badge-low">${level}</span>`;
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderMarkdown(text) {
  if (!text) return '<span style="color:var(--text-muted);font-size:12px;">暂无内容</span>';
  try { return marked.parse(text); } catch(e) { return `<pre>${text}</pre>`; }
}

function stageIcon(status) {
  if (status === "completed") return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="var(--green)" stroke-width="1.5"/><path d="M5 8.5l2 2 4-4" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  if (status === "running")   return `<svg class="spinner" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="rgba(59,130,246,0.3)" stroke-width="2"/><path d="M8 2 A6 6 0 0 1 14 8" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"/></svg>`;
  if (status === "error")     return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="var(--red)" stroke-width="1.5"/><path d="M8 5v4M8 11v1" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="rgba(107,114,128,0.5)" stroke-width="1.5"/></svg>`;
}

// ═══════════════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════════════
function renderSidebar() {
  const filtered = AppState.tasks.filter(t => {
    const q = AppState.taskSearchQuery.toLowerCase();
    if (!q) return true;
    if (t.id.toLowerCase().startsWith(q)) return true;
    return t.targets.some(tt => tt.url.toLowerCase().includes(q) || (tt.name||"").toLowerCase().includes(q));
  });

  const taskItems = filtered.map(t => {
    const firstTarget = t.targets[0];
    const url = firstTarget?.url || "";
    const shortUrl = url.replace(/^https?:\/\//, "").substring(0, 28);
    const sel = t.id === AppState.selectedTaskId;
    const dotClass = t.status === "running" ? "dot-running" : t.status === "completed" ? "dot-completed" : "dot-failed";
    return `<div class="task-item ${sel?"selected":""}" onclick="selectTask('${t.id}')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <div class="dot ${dotClass}"></div>
        <span style="font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${firstTarget?.name || shortUrl}</span>
        ${t.targets.length > 1 ? `<span class="badge-count">×${t.targets.length}</span>` : ""}
      </div>
      <div style="font-size:11px;color:var(--text-muted);padding-left:15px;">${shortUrl}</div>
      <div style="font-size:11px;color:var(--text-muted);padding-left:15px;margin-top:2px;">${fmtTime(t.created_at)}</div>
    </div>`;
  }).join("");

  document.getElementById("sidebar").innerHTML = `
    <button class="btn-primary" style="margin-bottom:10px;font-size:13px;padding:9px;" onclick="newScan()">+ 新建扫描</button>
    <div style="margin-bottom:10px;">
      <input type="text" placeholder="搜索任务..." value="${AppState.taskSearchQuery}"
        oninput="AppState.taskSearchQuery=this.value;renderSidebar()"
        style="font-size:12px;padding:7px 10px;">
    </div>
    <div style="flex:1;overflow-y:auto;">
      ${filtered.length === 0
        ? `<div style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:20px;">无匹配任务</div>`
        : taskItems}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  MAIN PANEL ROUTING
// ═══════════════════════════════════════════════════════════════
function renderMainPanel() {
  const task = AppState.tasks.find(t => t.id === AppState.selectedTaskId);
  if (!task || AppState.selectedTaskId === null) {
    document.getElementById("main-panel").innerHTML = renderConfigMode();
  } else {
    document.getElementById("main-panel").innerHTML = renderScanMode(task);
  }
}

function render() {
  renderSidebar();
  renderMainPanel();
  renderLlmModal();
}

// ── Per-target card ──
function renderTargetCard(target, idx) {
  const malStages  = ALL_STAGES.filter(s => s.category === "malicious");
  const vulnStages = ALL_STAGES.filter(s => s.category === "vuln");
  const selectedCount = target.stage_ids.length;
  const isEmpty = selectedCount === 0;

  return `
  <div class="card-inner" style="margin-bottom:10px;padding:12px;">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
      <input type="text" value="${target.name}" placeholder="名称（可选）"
        style="width:130px;flex-shrink:0;"
        oninput="AppState.configForm.targets[${idx}].name=this.value">
      <input type="url" value="${target.url}" placeholder="http://host:port/sse"
        style="flex:1;${!target.url||target.url.startsWith('http')?'':'border-color:var(--red);'}"
        oninput="updateTargetUrl(${idx},this.value)">
      ${AppState.configForm.targets.length > 1
        ? `<button class="btn-icon" style="flex-shrink:0;color:var(--red);" onclick="removeTarget(${idx})">✕</button>`
        : ""}
    </div>

    <!-- Stage selector toggle -->
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.02);"
      onclick="AppState.configForm.targets[${idx}].stagesOpen=!AppState.configForm.targets[${idx}].stagesOpen;render()">
      <span style="font-size:12px;color:var(--text-muted);">扫描阶段</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge-count ${isEmpty?"badge-high":""}">已选 ${selectedCount}/15</span>
        <span style="font-size:10px;color:var(--text-muted);">${target.stagesOpen?"▲":"▼"}</span>
      </div>
    </div>
    ${isEmpty ? `<div style="color:var(--red);font-size:11px;margin-top:4px;padding:0 4px;">⚠ 至少需要选择一个阶段</div>` : ""}

    ${target.stagesOpen ? renderStageCheckboxes(idx, malStages, vulnStages, target.stage_ids) : ""}
  </div>`;
}

function renderStageCheckboxes(idx, malStages, vulnStages, selectedIds) {
  const selSet = new Set(selectedIds);
  const chk = (stage) => {
    const checked = selSet.has(stage.id);
    return `<label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:4px;border-radius:4px;transition:background 0.1s;" onmouseover="this.style.background='rgba(255,255,255,0.04)'" onmouseout="this.style.background=''">
      <input type="checkbox" ${checked?"checked":""} onchange="toggleStage(${idx},${stage.id},this.checked)">
      <span style="color:${checked?"var(--text-main)":"var(--text-muted)"};" title="${stage.name}">${stage.id}. ${stage.name.length > 22 ? stage.name.substring(0,22)+"…" : stage.name}</span>
    </label>`;
  };

  const allMalChecked = malStages.every(s => selSet.has(s.id));
  const allVulnChecked = vulnStages.every(s => selSet.has(s.id));

  return `
  <div style="margin-top:10px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid var(--border);">
    <!-- Always-on stages -->
    <div style="margin-bottom:10px;display:flex;gap:8px;">
      <div class="stage-locked" style="flex:1;">🔒 <span style="color:#93c5fd;">Stage 1</span> Info Collection <span style="font-size:10px;margin-left:auto;color:var(--text-muted);">始终执行</span></div>
      <div class="stage-locked" style="flex:1;">🔒 <span style="color:#93c5fd;">Stage 27</span> Vuln Review <span style="font-size:10px;margin-left:auto;color:var(--text-muted);">始终执行</span></div>
    </div>

    <!-- Malicious group -->
    <div style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;font-weight:600;color:#f9a8d4;">恶意行为检测 (${malStages.length})</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleStageGroup(${idx},'malicious',true)">全选</button>
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleStageGroup(${idx},'malicious',false)">全不选</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;">
        ${malStages.map(s => chk(s)).join("")}
      </div>
    </div>

    <!-- Vuln group -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;font-weight:600;color:#86efac;">漏洞扫描 (${vulnStages.length})</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleStageGroup(${idx},'vuln',true)">全选</button>
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleStageGroup(${idx},'vuln',false)">全不选</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;">
        ${vulnStages.map(s => chk(s)).join("")}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  SCAN MODE
// ═══════════════════════════════════════════════════════════════
function renderScanMode(task) {
  const target = task.targets[AppState.selectedTargetIdx] || task.targets[0];
  const isRunning = task.status === "running";
  const completed = target.stages.filter(s => s.status === "completed").length;
  const total = target.stages.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  // Target tabs (only for multi-target tasks)
  const tabs = task.targets.length > 1
    ? `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        ${task.targets.map((tt, i) => {
          const dotCls = tt.status==="running"?"dot-running":tt.status==="completed"?"dot-completed":tt.status==="failed"?"dot-failed":"dot-pending";
          return `<div class="target-tab ${i===AppState.selectedTargetIdx?"active":""}" onclick="AppState.selectedTargetIdx=${i};AppState.selectedStageId=null;render()">
            <span class="dot ${dotCls}" style="display:inline-block;margin-right:6px;vertical-align:middle;"></span>
            ${tt.name || tt.url.replace(/^https?:\/\//,"").substring(0,20)}
          </div>`;
        }).join("")}
      </div>`
    : "";

  return `
  <div style="display:flex;flex-direction:column;height:100%;">
    ${tabs}
    <div style="display:flex;gap:16px;flex:1;min-height:0;">

      <!-- Left: Stage progress (40%) -->
      <div style="width:40%;flex-shrink:0;display:flex;flex-direction:column;gap:12px;">
        <!-- Header card -->
        <div class="card" style="padding:14px 16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="dot ${isRunning?"dot-running":"dot-completed"}"></div>
              <div>
                <div style="font-size:13px;font-weight:600;">${target.name||target.url.replace(/^https?:\/\//,"").substring(0,30)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${target.url}</div>
              </div>
            </div>
            ${isRunning
              ? `<button class="btn-danger" style="font-size:11px;padding:5px 10px;" onclick="abortTask('${task.id}')">中止扫描</button>`
              : `<button class="btn-secondary" style="font-size:11px;padding:5px 10px;" onclick="newScan()">新建扫描</button>`
            }
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:11px;color:var(--text-muted);">已完成 ${completed} / ${total} 个阶段</span>
            <span style="font-size:11px;color:var(--text-muted);">${pct}%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width:${pct}%;"></div>
          </div>
        </div>

        <!-- Stage cards -->
        <div class="card" style="flex:1;overflow-y:auto;padding:10px;">
          ${target.stages.map(s => {
            const active = AppState.selectedStageId === s.stage_id;
            return `<div class="stage-card ${s.status} ${active?"active":""}" id="stage-${s.stage_id}"
              onclick="AppState.selectedStageId=${s.stage_id};render()">
              <span class="stage-icon">${stageIcon(s.status)}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  <span style="color:var(--text-muted);margin-right:6px;">${s.stage_id}</span>${s.name}
                </div>
              </div>
              ${s.status==="running" ? `<span style="font-size:10px;color:var(--blue);">运行中</span>` : ""}
              ${s.status==="completed" ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round"/></svg>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>

      <!-- Right: Results (60%) -->
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;">
        ${renderResultsPanel(task, target)}
      </div>
    </div>
  </div>`;
}

function renderResultsPanel(task, target) {
  const selectedStage = target.stages.find(s => s.stage_id === AppState.selectedStageId);

  // If a completed stage is selected → show its output
  if (selectedStage && selectedStage.status === "completed" && selectedStage.output) {
    return `
    <div class="card" style="padding:14px 16px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--green);">✓</span>
        <span style="font-size:13px;font-weight:600;">${selectedStage.stage_id}. ${selectedStage.name}</span>
        <span class="badge-count" style="margin-left:auto;cursor:pointer;" onclick="AppState.selectedStageId=null;render()">✕ 关闭</span>
      </div>
    </div>
    <div class="card" style="flex:1;overflow-y:auto;padding:16px;">
      <div class="markdown-body">${renderMarkdown(selectedStage.output)}</div>
    </div>`;
  }

  // If stage 27 completed → show final report
  const finalStage = target.stages.find(s => s.stage_id === 27);
  if (finalStage && finalStage.status === "completed" && target.score !== null) {
    return renderFinalReport(target);
  }

  // Scanning in progress
  const completed = target.stages.filter(s => s.status === "completed").length;
  const total = target.stages.length;
  const runningStage = target.stages.find(s => s.status === "running");
  return `
  <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
    <div style="text-align:center;">
      <div class="spinner" style="display:inline-block;margin-bottom:16px;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="rgba(59,130,246,0.2)" stroke-width="3"/>
          <path d="M24 4 A20 20 0 0 1 44 24" stroke="url(#gs)" stroke-width="3" stroke-linecap="round"/>
          <defs><linearGradient id="gs" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#34d399"/></linearGradient></defs>
        </svg>
      </div>
      <div style="font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:6px;">
        ${target.status === "failed" ? "扫描失败" : target.status === "pending" ? "等待开始..." : "扫描进行中..."}
      </div>
      ${runningStage ? `<div style="font-size:12px;color:var(--blue);">正在执行: ${runningStage.stage_id}. ${runningStage.name}</div>` : ""}
      ${target.error ? `<div style="font-size:12px;color:var(--red);margin-top:8px;">${target.error}</div>` : ""}
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">已完成 ${completed} / ${total} 个阶段</div>
    </div>
    <div style="font-size:12px;color:var(--text-muted);">点击左侧已完成的阶段查看详情</div>
  </div>`;
}

function renderFinalReport(target) {
  const sc = target.score;
  const clr = scoreColor(sc);
  const circumference = 2 * Math.PI * 15.9;
  const dash = (sc / 100) * circumference;

  const vulns = target.vulnerabilities || [];
  const vulnRows = vulns.map((v,i) => {
    const open = AppState.expandedVulns.has(v.id);
    return `
    <div class="vuln-row">
      <div class="vuln-header" onclick="toggleVuln('${v.id}')">
        <span style="flex:1;font-size:13px;font-weight:500;">${v.title}</span>
        <span style="font-size:11px;color:var(--text-muted);margin-right:8px;">${v.risk_type||""}</span>
        ${levelBadge(v.level)}
        <span style="color:var(--text-muted);font-size:12px;margin-left:8px;">${open?"▲":"▼"}</span>
      </div>
      ${open ? `<div class="vuln-body">
        <div style="margin-bottom:8px;"><strong style="color:var(--text-main);">描述：</strong>${v.description||""}</div>
        <div><strong style="color:var(--text-main);">建议：</strong>${v.suggestion||""}</div>
      </div>` : ""}
    </div>`;
  }).join("");

  return `
  <!-- Score header -->
  <div class="card" style="padding:16px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:20px;">
      <svg viewBox="0 0 36 36" style="width:80px;height:80px;flex-shrink:0;">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="15.9" fill="none"
          stroke="${clr}" stroke-width="2.5"
          stroke-dasharray="${(sc/100)*100} ${100-sc}"
          stroke-linecap="round"
          transform="rotate(-90 18 18)"
          style="transition:stroke-dasharray 0.8s ease;"/>
        <text x="18" y="21" text-anchor="middle" font-size="9" fill="${clr}" font-weight="700">${sc}</text>
      </svg>
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">安全评分</div>
        <div style="font-size:24px;font-weight:700;color:${clr};">${sc} <span style="font-size:14px;font-weight:400;">/ 100</span></div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
          发现 ${vulns.length} 个安全问题 ·
          高危 ${vulns.filter(v=>v.level&&v.level.toLowerCase().includes("high")||v.level&&v.level.includes("高")).length} ·
          中危 ${vulns.filter(v=>v.level&&(v.level.toLowerCase().includes("med")||v.level.includes("中"))).length}
        </div>
      </div>
      ${target.url ? `<div style="font-size:11px;color:var(--text-muted);text-align:right;">${target.url}</div>` : ""}
    </div>
  </div>

  <!-- Vuln list -->
  ${vulns.length > 0 ? `
  <div class="card" style="padding:16px;flex-shrink:0;max-height:300px;overflow-y:auto;">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;">漏洞详情</div>
    ${vulnRows}
  </div>` : ""}

  <!-- Full report -->
  ${target.readme ? `
  <div class="card" style="flex:1;overflow-y:auto;padding:16px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;">完整报告</div>
    <div class="markdown-body">${renderMarkdown(target.readme)}</div>

}

// ── Scan start ──
async function startScan() {
  const form = AppState.configForm;

  // Validate
  for (const t of form.targets) {
    if (!t.url || !t.url.startsWith("http")) { alert("请输入有效的 URL（以 http:// 或 https:// 开头）"); return; }
    if (t.stage_ids.length === 0) { alert("每个目标至少需要选择一个扫描阶段"); return; }
  }
  if (!AppState.selectedLlmProfileId) { alert("请先配置 LLM 服务"); return; }

  const body = {
    llm_profile_id: AppState.selectedLlmProfileId,
    targets: form.targets.map(t => ({ name: t.name||null, url: t.url, stage_ids: t.stage_ids })),
    prompt: form.prompt,
    language: form.language,
    oauth_client_id:     form.oauth_client_id     || null,
    oauth_client_secret: form.oauth_client_secret || null,
    oauth_token_url:     form.oauth_token_url     || null,
    oauth_scope:         form.oauth_scope         || null,
  };

  try {
    const res = await fetch("/api/tasks", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    if (!res.ok) { const e = await res.json(); alert("创建任务失败: " + (e.detail || res.status)); return; }
    const task = await res.json();
    AppState.tasks.unshift(task);
    AppState.selectedTaskId = task.id;
    AppState.selectedTargetIdx = 0;
    AppState.selectedStageId = null;
    render();
    connectToTask(task.id);
  } catch(e) {
    alert("无法连接到后端服务器。请确认 web_server.py 已启动在 http://localhost:7788");
  }
}

// ── SSE ──
function connectToTask(taskId) {
  if (AppState.eventSource) { AppState.eventSource.close(); AppState.eventSource = null; }
  let retries = 0;
  function connect() {
    const es = new EventSource(`/api/tasks/${taskId}/stream`);
    AppState.eventSource = es;

    es.addEventListener("init", e => {
      const task = JSON.parse(e.data);
      const idx = AppState.tasks.findIndex(t => t.id === taskId);
      if (idx >= 0) AppState.tasks[idx] = task; else AppState.tasks.unshift(task);
      if (AppState.selectedTaskId === taskId) {
        AppState.selectedTargetIdx = task.current_target_idx || 0;
      }
      render();
    });
    es.addEventListener("target", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.current_target_idx = ev.target_index;
      if (AppState.selectedTaskId === taskId) {
        AppState.selectedTargetIdx = ev.target_index;
        AppState.selectedStageId = null;
      }
      const target = task.targets[ev.target_index];
      if (target) target.stages = buildStageList(ev.stage_ids);
      render();
    });
    es.addEventListener("stage", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (!task) return;
      const target = task.targets[task.current_target_idx];
      if (!target) return;
      const stage = target.stages.find(s => s.stage_id === ev.stage_id);
      if (stage) { stage.status = ev.status; if (ev.output) stage.output = ev.output; }
      if (ev.status === "running" && AppState.selectedTaskId === taskId && AppState.selectedStageId === null) {
        AppState.selectedStageId = null;
      }
      render();
      document.getElementById(`stage-${ev.stage_id}`)?.scrollIntoView({ behavior:"smooth", block:"nearest" });
    });
    es.addEventListener("result", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (!task) return;
      const target = task.targets[ev.target_index];
      if (target) Object.assign(target, { score:ev.score, vulnerabilities:ev.results, readme:ev.readme, status:"completed" });
      render();
    });
    es.addEventListener("done", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (task) task.status = ev.status;
      es.close(); AppState.eventSource = null;
      render();
    });
    es.onerror = () => {
      es.close();
      if (retries < 3) { retries++; setTimeout(connect, 3000); }
    };
  }
  connect();
}

async function abortTask(id) {
  if (!confirm("确认中止此扫描任务？")) return;
  if (AppState.eventSource) { AppState.eventSource.close(); AppState.eventSource = null; }
  try {
    await fetch(`/api/tasks/${id}`, { method:"DELETE" });
    await loadTasks();
  } catch(e) {
    const task = AppState.tasks.find(t => t.id === id);
    if (task) task.status = "failed";
    render();
  }
}

async function saveLlmProfile() {
  const f = AppState.llmForm;
  if (!f.name || !f.base_url || !f.model) { alert("名称、API URL 和 Model 不能为空"); return; }
  if (!AppState.editingProfileId && !f.api_key) { alert("API Key 不能为空"); return; }

  const body = { name:f.name, base_url:f.base_url, model:f.model, is_default:f.is_default };
  if (f.api_key) body.api_key = f.api_key;

  try {
    let res;
    if (AppState.editingProfileId) {
      res = await fetch(`/api/llm-profiles/${AppState.editingProfileId}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    } else {

      body.api_key = f.api_key;
      res = await fetch("/api/llm-profiles", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    }
    if (!res.ok) { const e = await res.json(); alert("保存失败: " + (e.detail || res.status)); return; }
    await loadLlmProfiles();
    closeLlmModal();
  } catch(e) {

    AppState.llmProfiles.push(newP);
    if (!AppState.selectedLlmProfileId || f.is_default) AppState.selectedLlmProfileId = id;
    closeLlmModal();
  }
}

async function deleteLlmProfile(id) {
  try {

    AppState.llmProfiles = AppState.llmProfiles.filter(p => p.id !== id);

function exportConfig() {
  const form = AppState.configForm;
  const profile = AppState.llmProfiles.find(p => p.id === AppState.selectedLlmProfileId);
  const data = {
    version: 1,
    llm_profile_name: profile?.name || null,
    targets: form.targets.map(t => ({ name:t.name||null, url:t.url, stage_ids:t.stage_ids.length < ALL_STAGE_IDS.length ? t.stage_ids : null })),
    prompt: form.prompt,
    language: form.language,
    oauth_client_id: form.oauth_client_id || null,
    oauth_client_secret: form.oauth_client_secret || null,
    oauth_token_url: form.oauth_token_url || null,
    oauth_scope: form.oauth_scope || null,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `mcp-scan-config-${today}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importConfig() { document.getElementById("import-input").click(); }

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.version !== 1 || !Array.isArray(data.targets) || data.targets.length === 0) {
        alert("无效的配置文件格式"); return;
      }
      AppState.configForm = {
        targets: data.targets.map(t => ({
          name: t.name || "",
          url: t.url || "",
          stage_ids: t.stage_ids || [...ALL_STAGE_IDS],
          stagesOpen: false,
        })),
        prompt: data.prompt || "",
        language: data.language || "zh",
        oauth_client_id: data.oauth_client_id || "",
        oauth_client_secret: data.oauth_client_secret || "",
        oauth_token_url: data.oauth_token_url || "",
        oauth_scope: data.oauth_scope || "",
      };
      // Match LLM profile by name
      if (data.llm_profile_name) {
        const match = AppState.llmProfiles.find(p => p.name.toLowerCase() === data.llm_profile_name.toLowerCase());
        if (match) {
          AppState.selectedLlmProfileId = match.id;
        } else {
          setTimeout(() => alert(`提示：LLM 服务 "${data.llm_profile_name}" 未找到，请手动选择`), 100);
        }
      }
      AppState.selectedTaskId = null;
      AppState.panelOpen.targets = true;
      render();
    } catch(err) { alert("解析配置文件失败: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
window.addEventListener("DOMContentLoaded", async () => {
  // Initialize with mock data for Phase 1 standalone testing
  initMockData();
  render();

  // Try to load real data from backend (will silently fail if not running)
  await Promise.all([loadTasks(), loadLlmProfiles()]);

  // Auto-connect SSE for any running task
  const running = AppState.tasks.find(t => t.status === "running");
  if (running && AppState.selectedTaskId === running.id) connectToTask(running.id);
});
</script>
