<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA MCP Judgment Eye</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/web/marked.min.js"></script>
<link rel="stylesheet" href="/web/css/styles.css">
</head>
<body>

<!-- ═══════════════════════════════════════ HEADER ════════════════════════════════════ -->
<header style="background: linear-gradient(135deg, #111115, #0f0f18); border-bottom: 1px solid var(--border); flex-shrink: 0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="/web/img/0de12e07-42cb-49b0-a4c4-f3149b88275c.png" width="28" height="28" style="border-radius:4px;" alt="AVA MCP Judgment Eye">
    <span class="gradient-text" style="font-size:17px;font-weight:700;letter-spacing:-0.3px;">AVA MCP Judgment Eye</span>
  </div>
  <div style="font-size:12px;color:var(--text-muted);">AVA-MCP-Scanner · mcp-scan</div>
</header>

<!-- ═══════════════════════════════════════ BODY ══════════════════════════════════════ -->
<div style="display:flex;flex:1;overflow:hidden;">

  <!-- ─────────────────── SIDEBAR ─────────────────── -->
  <aside id="sidebar" style="width:240px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;padding:14px 10px 10px;"></aside>

  <div id="resize-sidebar" class="resize-handle-h"></div>

  <!-- ─────────────────── MAIN PANEL ─────────────────── -->
  <main id="main-panel" style="flex:1;overflow-y:auto;padding:20px 24px;"></main>
</div>

<!-- ═══════════════════════════════════════ LLM MODAL ════════════════════════════════ -->
<div id="llm-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeLlmModal()">
  <div class="modal-card" id="llm-modal-card"></div>
</div>


<script src="/web/js/constants.js"></script>
<script src="/web/js/helpers.js"></script>
<script src="/web/js/render-core.js"></script>
<script src="/web/js/render-config.js"></script>
<script src="/web/js/render-scan.js"></script>
<script src="/web/js/api.js"></script>
<script src="/web/js/resize.js"></script>
<script src="/web/js/handlers.js"></script>
</body>
</html>
