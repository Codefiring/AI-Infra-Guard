<style>
  :root {
    --bg-body:    #0d0d10;
    --bg-sidebar: #111115;
    --bg-card:    #18181f;
    --bg-card2:   #141419;
    --border:     rgba(255,255,255,0.07);
    --border-hl:  rgba(255,255,255,0.14);
    --text-main:  #f1f1f3;
    --text-muted: #6b7280;
    --blue:       #3b82f6;
    --green:      #34d399;
    --amber:      #fbbf24;
    --red:        #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-body);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* ── Cards ── */
  .card {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-card2));
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    border-radius: 12px;
  }
  .card-inner {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  /* ── Inputs ── */
  input[type=text], input[type=url], input[type=password], textarea, select {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: rgba(59,130,246,0.5);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }
  select option { background: #1e1e28; }
  textarea { resize: vertical; }

  /* ── Buttons ── */
  .btn-primary {
    background: linear-gradient(to right, #3b82f6, #34d399);
    box-shadow: 0 0 20px rgba(59,130,246,0.3);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .btn-primary:hover { opacity: 0.9; box-shadow: 0 0 28px rgba(59,130,246,0.45); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-hl);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
  .btn-danger {
    background: rgba(248,113,113,0.12);
    border: 1px solid rgba(248,113,113,0.25);
    color: var(--red);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-danger:hover { background: rgba(248,113,113,0.22); }
  .btn-icon {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

  /* ── Gradient text ── */
  .gradient-text {
    background: linear-gradient(135deg, #60a5fa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Collapsible panels ── */
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .panel-header:hover { background: rgba(255,255,255,0.03); }
  .panel-content { padding: 0 16px 16px; }
  .panel-arrow { transition: transform 0.2s; font-size: 10px; color: var(--text-muted); }
  .panel-arrow.open { transform: rotate(90deg); }

  /* ── Stage progress cards ── */
  .stage-card {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
  }
  .stage-card:hover { background: rgba(255,255,255,0.04); }
  .stage-card.active { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); }
  .stage-card.running {
    background: rgba(59,130,246,0.06);
    border-left: 2px solid var(--blue);
    box-shadow: -4px 0 12px rgba(59,130,246,0.15);
    animation: pulse-glow 2s infinite;
  }
  .stage-card.completed .stage-icon { color: var(--green); }
  .stage-card.running .stage-icon { color: var(--blue); }
  .stage-card.error .stage-icon { color: var(--red); }
  .stage-card.pending .stage-icon { color: var(--text-muted); }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: -4px 0 12px rgba(59,130,246,0.15); }
    50%       { box-shadow: -4px 0 20px rgba(59,130,246,0.35); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }

  /* ── Sidebar task items ── */
  .task-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    margin-bottom: 4px;
  }
  .task-item:hover { background: rgba(255,255,255,0.04); }
  .task-item.selected { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); }

  /* ── Status dots ── */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-running { background: var(--blue); box-shadow: 0 0 6px var(--blue); animation: pulse-glow 1.5s infinite; }
  .dot-completed { background: var(--green); }
  .dot-failed { background: var(--red); }
  .dot-pending { background: var(--text-muted); }

  /* ── Severity badges ── */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-high   { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
  .badge-medium { background: rgba(251,191,36,0.12);  color: var(--amber); border: 1px solid rgba(251,191,36,0.25); }
  .badge-low    { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.25); }
  .badge-count  { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); font-size: 11px; padding: 1px 7px; border-radius: 10px; }

  /* ── Checkbox ── */
  input[type=checkbox] {
    width: 14px; height: 14px; border-radius: 3px; cursor: pointer;
    accent-color: var(--blue);
  }

  /* ── Markdown body ── */
  .markdown-body { font-size: 13px; line-height: 1.7; color: var(--text-main); }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #c7d2fe; font-weight: 600; margin: 1em 0 0.5em; }
  .markdown-body h1 { font-size: 1.25em; }
  .markdown-body h2 { font-size: 1.1em; }
  .markdown-body h3 { font-size: 1em; }
  .markdown-body p { margin: 0.5em 0; }
  .markdown-body code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .markdown-body pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0.8em 0; }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border-hl); padding: 6px 10px; font-size: 12px; }
  .markdown-body th { background: rgba(255,255,255,0.05); font-weight: 600; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0.5em 0; }
  .markdown-body li { margin: 0.2em 0; }
  .markdown-body blockquote { border-left: 3px solid var(--blue); padding-left: 12px; color: var(--text-muted); margin: 0.8em 0; }
  .markdown-body a { color: #60a5fa; text-decoration: underline; }

  /* ── Progress bar ── */
  .progress-bar-track { background: rgba(255,255,255,0.06); border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(to right, #3b82f6, #34d399);
    transition: width 0.5s ease;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  .progress-bar-fill::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }
  .progress-bar-fill { position: relative; overflow: hidden; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: linear-gradient(135deg, #1a1a24, #14141c);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    border-radius: 16px;
    width: 560px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }

  /* ── Vuln accordion ── */
  .vuln-row { border-bottom: 1px solid var(--border); }
  .vuln-row:last-child { border-bottom: none; }
  .vuln-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
  .vuln-body { padding: 0 0 12px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  /* ── Target tabs (batch scan) ── */
  .target-tab {
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-muted);
    transition: all 0.15s; white-space: nowrap;
  }
  .target-tab.active {
    background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4);
    color: #93c5fd;
  }
  .target-tab:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text-main); }

  /* ── Lock row for always-on stages ── */
  .stage-locked {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    color: var(--text-muted); font-size: 12px;
  }

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

  /* ── Score gauge colors ── */
  .score-high   { stroke: var(--green);  fill: var(--green);  }
  .score-medium { stroke: var(--amber);  fill: var(--amber);  }
  .score-low    { stroke: var(--red);    fill: var(--red);    }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ HEADER ════════════════════════════════════ -->
<header style="background: linear-gradient(135deg, #111115, #0f0f18); border-bottom: 1px solid var(--border); flex-shrink: 0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;">
  <div style="display:flex;align-items:center;gap:12px;">

function buildStageList(stageIds) {

}

function scoreColor(score) {
  if (score === null || score === undefined) return "var(--text-muted)";
  if (score >= 70) return "var(--green)";
  if (score >= 40) return "var(--amber)";
  return "var(--red)";
}

function levelBadge(level) {
  const l = (level||"").toLowerCase();
  if (l.includes("high") || l.includes("高")) return `<span class="badge badge-high">${level}</span>`;
  if (l.includes("med")  || l.includes("中")) return `<span class="badge badge-medium">${level}</span>`;

}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderMarkdown(text) {
  if (!text) return '<span style="color:var(--text-muted);font-size:12px;">No content</span>';
  try { return marked.parse(text); } catch(e) { return `<pre>${text}</pre>`; }
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Parse the structured vuln-stage output format:
//   # Overview  /  # Threats (<threat>…</threat>)  /  # Reasons  /  # Summarization
function parseVulnOutput(text) {
  const sectionLines = { overview: [], threats: [], reasons: [], summary: [] };
  let cur = null;
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (/^#\s+Overview/i.test(t))      { cur = 'overview';  continue; }
    if (/^#\s+Threats/i.test(t))       { cur = 'threats';   continue; }
    if (/^#\s+Reasons/i.test(t))       { cur = 'reasons';   continue; }
    if (/^#\s+Summarization/i.test(t)) { cur = 'summary';   continue; }
    if (t.startsWith('#'))             { cur = null;         continue; }
    if (cur) sectionLines[cur].push(line);
  }

  const threatsText = sectionLines.threats.join('\n');
  const threats = [];
  const re = /<threat>([\s\S]*?)<\/threat>/g;
  let m;
  while ((m = re.exec(threatsText)) !== null) {
    const c = m[1];
    const get = tag => (c.match(new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`)) || [])[1]?.trim() || '';
    threats.push({
      toolName:   get('tool_name'),
      type:       get('type'),
      confidence: parseFloat(get('confidence') || '0'),
      impact:     get('impact'),
    });
  }

  const reasonsRaw = sectionLines.reasons.join('\n').trim();
  const reasons = reasonsRaw
    ? reasonsRaw.split(/\n\s*-\s+/).map(r => r.trim()).filter(Boolean)
    : [];

  return {
    isRisk:  /yes/i.test(sectionLines.overview.join(' ')),
    threats,
    reasons,
    summary: sectionLines.summary.join('\n').trim(),
  };
}

// Render a vuln-stage output with structured cards when the format is detected;
// falls back to plain markdown rendering otherwise.
function renderVulnStageOutput(text) {
  if (!text) return '<span style="color:var(--text-muted);font-size:12px;">No content</span>';
  if (!/<threat>/.test(text)) return `<div class="markdown-body">${renderMarkdown(text)}</div>`;

  const d = parseVulnOutput(text);

  const impactColor = imp => {
    const i = (imp || '').toLowerCase();
    if (i === 'high' || i === 'critical') return 'var(--red)';
    if (i === 'medium') return 'var(--amber)';
    return 'var(--green)';
  };
  const confColor = c => c >= 0.8 ? 'var(--red)' : c >= 0.6 ? 'var(--amber)' : 'var(--text-muted)';

  // ── Overview badge ──────────────────────────────────────────────
  let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
    <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Overview</span>
    <span style="padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;
      background:${d.isRisk ? 'rgba(248,113,113,0.12)' : 'rgba(52,211,153,0.12)'};
      color:${d.isRisk ? 'var(--red)' : 'var(--green)'};">
      ${d.isRisk ? '⚠ Risk Detected' : '✓ No Risk Detected'}
    </span>
  </div>`;

  // ── Threats ─────────────────────────────────────────────────────
  if (d.threats.length > 0) {
    html += `<div style="margin-bottom:16px;">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">
        Threats (${d.threats.length})
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">`;
    for (const t of d.threats) {
      const pct = Math.round(t.confidence * 100);
      html += `<div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:10px 12px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <code style="font-size:11px;padding:2px 7px;background:rgba(96,165,250,0.12);color:#60a5fa;border-radius:4px;">${escapeHtml(t.toolName)}</code>
          <span style="font-size:12px;font-weight:500;flex:1;min-width:0;">${escapeHtml(t.type)}</span>
          <span style="font-size:11px;font-weight:600;color:${impactColor(t.impact)};">${escapeHtml(t.impact)}</span>
          <span style="font-size:11px;color:${confColor(t.confidence)};">${pct}% conf</span>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Reasons ─────────────────────────────────────────────────────
  if (d.reasons.length > 0) {
    html += `<div style="margin-bottom:16px;">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Reasons</div>
      <div style="display:flex;flex-direction:column;gap:6px;">`;
    for (const r of d.reasons) {
      html += `<div style="font-size:12px;padding:8px 10px;background:rgba(255,255,255,0.02);
        border-left:2px solid var(--border-hl);border-radius:0 4px 4px 0;line-height:1.6;">
        ${renderMarkdown(r)}
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Summary ──────────────────────────────────────────────────────
  if (d.summary) {
    html += `<div>
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Summary</div>
      <div class="markdown-body" style="font-size:12px;">${renderMarkdown(d.summary)}</div>
    </div>`;
  }

  return html;
}

function renderSavedConfigsPanel() {
  const configs = AppState.savedConfigs;
  const items = configs.length === 0
    ? `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:20px 0;">No saved configs</div>`
    : configs.map(c => {
        const cfg = JSON.stringify(c).replace(/\\/g,"\\\\").replace(/"/g,"&quot;");
        return `
        <div onclick="applyConfig(JSON.parse(this.dataset.cfg))" data-cfg="${cfg}"
             style="cursor:pointer;padding:8px 10px;border-radius:8px;margin-bottom:4px;
                    background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
                    transition:background 0.15s;display:flex;align-items:center;gap:6px;"
             onmouseover="this.style.background='rgba(255,255,255,0.07)'"
             onmouseout="this.style.background='rgba(255,255,255,0.03)'">
          <div style="flex:1;min-width:0;">
            <div style="font-size:12px;font-weight:500;color:var(--text-main);
                        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                 title="${c.name}">${c.name}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:2px;
                        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                 title="${c.url}">${c.url}</div>
          </div>
          <button onclick="event.stopPropagation();deleteSavedConfig('${c.id}')"
                  style="flex-shrink:0;background:none;border:none;cursor:pointer;
                         color:#6b7280;font-size:14px;padding:2px 4px;line-height:1;"
                  onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#6b7280'"
                  title="Delete">✕</button>
        </div>`;
      }).join("");

  return `
  <div style="width:220px;flex-shrink:0;padding-top:2px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span style="font-size:13px;font-weight:600;color:var(--text-main);">Saved Configs</span>
    </div>
    ${items}
  </div>`;
}

function renderStageCheckboxes(stages, selectedIds) {
  const selSet = new Set(selectedIds);
  const chk = (stage) => {
    const checked = selSet.has(stage.id);
    const label = stage.name.length > 22 ? stage.name.substring(0,22)+"…" : stage.name;
    return `<label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:4px;border-radius:4px;transition:background 0.1s;" onmouseover="this.style.background='rgba(255,255,255,0.04)'" onmouseout="this.style.background=''">
      <input type="checkbox" ${checked?"checked":""} onchange="toggleStage(${stage.id},this.checked)">
      <span title="${stage.risk_type} ${stage.name}" style="color:${checked?"var(--text-main)":"var(--text-muted)"};">
        <span style="font-size:10px;color:#60a5fa;margin-right:3px;">${stage.risk_type}</span>${label}
      </span>
    </label>`;
  };

  return `
  <div style="margin-top:10px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid var(--border);">
    <!-- Always-on stages -->
    <div style="margin-bottom:10px;display:flex;gap:8px;">
      <div class="stage-locked" style="flex:1;">🔒 <span style="color:#93c5fd;">Info Collection</span> <span style="font-size:10px;margin-left:auto;color:var(--text-muted);">Always on</span></div>
      <div class="stage-locked" style="flex:1;">🔒 <span style="color:#93c5fd;">Vuln Review</span> <span style="font-size:10px;margin-left:auto;color:var(--text-muted);">Always on</span></div>
    </div>

    <!-- Flat stage list -->
    <div style="margin-bottom:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;font-weight:600;color:#9ca3af;">Stages (${stages.length})</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleAllStages(true)">Select all</button>
          <button class="btn-icon" style="font-size:10px;padding:2px 8px;" onclick="toggleAllStages(false)">Deselect all</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;">
        ${stages.map(s => chk(s)).join("")}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  SCAN MODE
// ═══════════════════════════════════════════════════════════════
function renderScanMode(task) {
  const target = task.targets[0];
  if (!target) return `<div style="color:var(--text-muted);text-align:center;padding:40px;">No scan target</div>`;
  const isRunning = task.status === "running" || task.status === "pending";
  const stages = target.stages || [];
  const completed = stages.filter(s => s.status === "completed").length;
  const total = stages.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  return `
  <div style="display:flex;flex-direction:column;height:100%;">
    <div style="display:flex;gap:16px;flex:1;min-height:0;">

      <!-- Left: Stage progress (40%) -->
      <div style="width:40%;flex-shrink:0;display:flex;flex-direction:column;gap:12px;">
        <!-- Header card -->
        <div class="card" style="padding:14px 16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="dot ${isRunning?"dot-running":"dot-completed"}"></div>
              <div>
                <div style="font-size:13px;font-weight:600;">${target.name||target.url.replace(/^https?:\/\//,"").substring(0,30)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${target.url}</div>
              </div>
            </div>
            <div style="display:flex;gap:6px;">
              ${isRunning ? `<button class="btn-danger" style="font-size:11px;padding:5px 10px;" onclick="abortTask('${task.id}')">Stop Scan</button>` : ""}
              <button class="btn-secondary" style="font-size:11px;padding:5px 10px;" onclick="newScan()">New Scan</button>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:11px;color:var(--text-muted);">${completed} / ${total} stages completed</span>
            <span style="font-size:11px;color:var(--text-muted);">${pct}%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width:${pct}%;"></div>
          </div>
        </div>

        <!-- Stage cards -->
        <div class="card" style="flex:1;overflow-y:auto;padding:10px;">
          ${stages.map(s => {
            const active = AppState.selectedStageId === s.stage_id;
            return `<div class="stage-card ${s.status} ${active?"active":""}" id="stage-${s.stage_id}"
              onclick="AppState.selectedStageId=${s.stage_id};render()">
              <span class="stage-icon">${stageIcon(s.status)}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  <span style="color:var(--text-muted);margin-right:6px;">${s.position}</span>${s.name}
                </div>
              </div>
              ${s.status==="running" ? `<span style="font-size:10px;color:var(--blue);">Running</span>` : ""}
              ${s.status==="completed" ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round"/></svg>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>

      <!-- Right: Results (60%) -->
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;">
        ${renderResultsPanel(task, target)}
      </div>
    </div>
  </div>`;
}

function renderResultsPanel(task, target) {
  const stageList = target.stages || [];
  const selectedStage = stageList.find(s => s.stage_id === AppState.selectedStageId);

  // If a completed stage is selected → show its output
  if (selectedStage && selectedStage.status === "completed" && selectedStage.output) {
    return `
    <div class="card" style="padding:14px 16px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--green);">✓</span>
        <span style="font-size:13px;font-weight:600;">${selectedStage.name}</span>
        <span class="badge-count" style="margin-left:auto;cursor:pointer;" onclick="AppState.selectedStageId=null;render()">✕ Close</span>
      </div>
    </div>
    <div class="card" style="flex:1;overflow-y:auto;padding:16px;">
      ${renderVulnStageOutput(selectedStage.output)}
    </div>`;
  }

  // If final stage completed → show final report
  const finalStage = stageList[stageList.length - 1];
  if (finalStage && finalStage.status === "completed" && target.score !== null) {
    return renderFinalReport(target);
  }

  // Scanning in progress
  const completed = stageList.filter(s => s.status === "completed").length;
  const total = stageList.length;
  const runningStage = stageList.find(s => s.status === "running");
  return `
  <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
    <div style="text-align:center;">
      <div class="spinner" style="display:inline-block;margin-bottom:16px;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="rgba(59,130,246,0.2)" stroke-width="3"/>
          <path d="M24 4 A20 20 0 0 1 44 24" stroke="url(#gs)" stroke-width="3" stroke-linecap="round"/>
          <defs><linearGradient id="gs" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#34d399"/></linearGradient></defs>
        </svg>
      </div>
      <div style="font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:6px;">
        ${target.status === "failed" ? "Scan Failed" : target.status === "pending" ? "Waiting to start..." : "Scan in progress..."}
      </div>
      ${runningStage ? `<div style="font-size:12px;color:var(--blue);">Running: ${runningStage.name}</div>` : ""}
      ${target.error ? `<div style="font-size:12px;color:var(--red);margin-top:8px;">${target.error}</div>` : ""}
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">${completed} / ${total} stages completed</div>
    </div>
    <div style="font-size:12px;color:var(--text-muted);">Click a completed stage on the left to view details</div>
  </div>`;
}

function renderFinalReport(target) {
  const sc = target.score;
  const clr = scoreColor(sc);
  const circumference = 2 * Math.PI * 15.9;
  const dash = (sc / 100) * circumference;

  const vulns = target.vulnerabilities || [];
  const vulnRows = vulns.map((v,i) => {
    const open = AppState.expandedVulns.has(v.id);
    return `
    <div class="vuln-row">
      <div class="vuln-header" onclick="toggleVuln('${v.id}')">
        <span style="flex:1;font-size:13px;font-weight:500;">${v.title}</span>
        ${v.tool_name ? `<code style="font-size:10px;padding:2px 6px;background:rgba(96,165,250,0.12);color:#60a5fa;border-radius:4px;margin-right:4px;white-space:nowrap;">${escapeHtml(v.tool_name)}</code>` : ""}
        <span style="font-size:11px;color:var(--text-muted);margin-right:8px;">${v.risk_type||""}</span>
        ${levelBadge(v.level)}
        <span style="color:var(--text-muted);font-size:12px;margin-left:8px;">${open?"▲":"▼"}</span>
      </div>
      ${open ? `<div class="vuln-body">
        <div style="margin-bottom:10px;">
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Description</div>
          <div class="markdown-body" style="font-size:12px;">${renderMarkdown(v.description||"")}</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Suggestion</div>
          <div class="markdown-body" style="font-size:12px;">${renderMarkdown(v.suggestion||"")}</div>
        </div>
      </div>` : ""}
    </div>`;
  }).join("");

  return `
  <!-- Score header -->
  <div class="card" style="padding:16px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:20px;">
      <svg viewBox="0 0 36 36" style="width:80px;height:80px;flex-shrink:0;">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="15.9" fill="none"
          stroke="${clr}" stroke-width="2.5"
          stroke-dasharray="${(sc/100)*100} ${100-sc}"
          stroke-linecap="round"
          transform="rotate(-90 18 18)"
          style="transition:stroke-dasharray 0.8s ease;"/>
        <text x="18" y="21" text-anchor="middle" font-size="9" fill="${clr}" font-weight="700">${sc}</text>
      </svg>
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">Security Score</div>
        <div style="font-size:24px;font-weight:700;color:${clr};">${sc} <span style="font-size:14px;font-weight:400;">/ 100</span></div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
          Found ${vulns.length} issues ·
          High ${vulns.filter(v=>v.level&&(v.level.toLowerCase().includes("high")||v.level.includes("高"))).length} ·
          Medium ${vulns.filter(v=>v.level&&(v.level.toLowerCase().includes("med")||v.level.includes("中"))).length}
        </div>
      </div>
      ${target.url ? `<div style="font-size:11px;color:var(--text-muted);text-align:right;">${target.url}</div>` : ""}
    </div>
  </div>

  <!-- Vuln list -->
  ${vulns.length > 0 ? `
  <div class="card" style="padding:16px;flex-shrink:0;max-height:300px;overflow-y:auto;">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;">Vulnerabilities</div>
    ${vulnRows}
  </div>` : ""}

  <!-- Full report -->
  ${target.readme ? `
  <div class="card" style="flex:1;overflow-y:auto;padding:16px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;">Full Report</div>
    <div class="markdown-body">${renderMarkdown(target.readme)}</div>
  </div>` : ""}`;
}

function renderLlmModal() {
  const modal = document.getElementById("llm-modal");
  if (!AppState.showLlmModal) { modal.style.display = "none"; return; }
  modal.style.display = "flex";

  const profiles = AppState.llmProfiles;
  const editing = AppState.editingProfileId;
  const ep = editing ? profiles.find(p=>p.id===editing) : null;
  const f = AppState.llmForm;

  const profileList = profiles.map(p => `
  <div style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);margin-bottom:8px;gap:12px;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:500;">${p.is_default?"★ ":""}${p.name}</div>
      <div style="font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.model} · ${p.base_url}</div>
    </div>
    <button class="btn-icon" onclick="editLlmProfile('${p.id}')">Edit</button>
    <button class="btn-danger" onclick="confirmDeleteLlm('${p.id}')">Del</button>
  </div>`).join("");

  const formHtml = AppState.llmFormOpen ? `
  <hr class="divider" style="margin:16px 0;">
  <div style="font-size:13px;font-weight:600;margin-bottom:12px;">${editing ? "Edit LLM Service" : "Add LLM Service"}</div>
  <div style="display:grid;gap:10px;">
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Name</label>
      <input type="text" id="llm-name" value="${f.name}" placeholder="OpenRouter DeepSeek V3" oninput="AppState.llmForm.name=this.value">
    </div>
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">API URL</label>
      <input type="url" id="llm-url" value="${f.base_url}" placeholder="https://openrouter.ai/api/v1" oninput="AppState.llmForm.base_url=this.value">
    </div>
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">API Key</label>
      <input type="password" id="llm-key" value="${f.api_key}" placeholder="sk-..." oninput="AppState.llmForm.api_key=this.value">
    </div>
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">Model</label>
      <input type="text" id="llm-model" value="${f.model}" placeholder="deepseek/deepseek-v3" oninput="AppState.llmForm.model=this.value">
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
      <input type="checkbox" ${f.is_default?"checked":""} onchange="AppState.llmForm.is_default=this.checked">
      Set as default
    </label>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="btn-secondary" style="flex:1;" onclick="cancelLlmForm()">Cancel</button>
    <button class="btn-primary" style="flex:1;" onclick="saveLlmProfile()">Save</button>
  </div>` : "";

  document.getElementById("llm-modal-card").innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <h3 style="font-size:16px;font-weight:700;" class="gradient-text">LLM Services</h3>
    <button class="btn-icon" onclick="closeLlmModal()">✕</button>
  </div>
  ${profiles.length === 0
    ? `<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">No LLM services. Add one below.</div>`
    : profileList}
  ${!AppState.llmFormOpen
    ? `<button class="btn-secondary" style="width:100%;margin-top:4px;" onclick="AppState.llmFormOpen=true;AppState.editingProfileId=null;AppState.llmForm={name:'',base_url:'https://openrouter.ai/api/v1',api_key:'',model:'',is_default:false};renderLlmModal()">+ Add LLM Service</button>`
    : ""}
  ${formHtml}`;
}

// ═══════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════
function newScan() {
  AppState.selectedTaskId = null;
  AppState.selectedStageId = null;
  AppState.configForm = {
    name: "", url: "", stage_ids:[...ALL_STAGE_IDS], stagesOpen:false,
    prompt:"", language:"en",
    oauth_client_id:"", oauth_client_secret:"", oauth_token_url:"", oauth_scope:"",
  };
  render();
}

async function selectTask(id) {
  AppState.selectedTaskId = id;
  AppState.selectedStageId = null;
  render();
  // Fetch full task detail (includes stages) — list API omits them for performance
  try {
    const res = await fetch(`/api/tasks/${id}`);
    if (res.ok) {
      const full = await res.json();
      full.targets?.forEach(t => t.stages?.forEach((s, i) => { s.position = i + 1; }));
      const idx = AppState.tasks.findIndex(t => t.id === id);
      if (idx >= 0) AppState.tasks[idx] = full; else AppState.tasks.unshift(full);
      render();
    }
  } catch(e) { /* backend unavailable */ }
  // Auto-connect SSE if task is running
  const task = AppState.tasks.find(t => t.id === id);
  if (task && (task.status === "running" || task.status === "pending")) connectToTask(id);
}

function togglePanel(name) {
  AppState.panelOpen[name] = !AppState.panelOpen[name];
  render();
}

function toggleStage(stageId, checked) {
  const ids = AppState.configForm.stage_ids;
  if (checked && !ids.includes(stageId)) ids.push(stageId);
  if (!checked) {
    const i = ids.indexOf(stageId);
    if (i >= 0) ids.splice(i, 1);
  }
  render();
}

function toggleAllStages(select) {
  AppState.configForm.stage_ids = select ? ALL_STAGES.map(s => s.id) : [];
  render();
}

function toggleVuln(id) {
  if (AppState.expandedVulns.has(id)) AppState.expandedVulns.delete(id);
  else AppState.expandedVulns.add(id);
  render();
}

// ── Scan start ──
async function startScan() {
  const form = AppState.configForm;

  // Validate
  if (!form.url || !form.url.startsWith("http")) { alert("Please enter a valid URL (must start with http:// or https://)"); return; }
  if (form.stage_ids.length === 0) { alert("Please select at least one scan stage"); return; }
  if (!AppState.selectedLlmProfileId) { alert("Please configure an LLM service first"); return; }

  const body = {
    name: form.name || "",
    llm_profile_id: AppState.selectedLlmProfileId,
    url: form.url,
    stage_ids: form.stage_ids,
    prompt: form.prompt,
    language: form.language,
    oauth_client_id:     form.oauth_client_id     || null,
    oauth_client_secret: form.oauth_client_secret || null,
    oauth_token_url:     form.oauth_token_url     || null,
    oauth_scope:         form.oauth_scope         || null,
  };

  try {
    const res = await fetch("/api/tasks", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    if (!res.ok) { const e = await res.json(); alert("Failed to create task: " + (e.detail || res.status)); return; }
    const task = await res.json();
    AppState.tasks.unshift(task);
    AppState.selectedTaskId = task.id;
    AppState.selectedStageId = null;
    render();
    connectToTask(task.id);
  } catch(e) {
    alert("Cannot connect to backend. Make sure web_server.py is running on http://localhost:7788");
  }
}

// ── SSE ──
function connectToTask(taskId) {
  if (AppState.eventSource) { AppState.eventSource.close(); AppState.eventSource = null; }
  let retries = 0;
  function connect() {
    const es = new EventSource(`/api/tasks/${taskId}/stream`);
    AppState.eventSource = es;

    es.addEventListener("init", e => {
      const task = JSON.parse(e.data);
      // Assign sequential display positions to stages loaded from DB
      task.targets?.forEach(t => t.stages?.forEach((s, i) => { s.position = i + 1; }));
      const idx = AppState.tasks.findIndex(t => t.id === taskId);
      if (idx >= 0) AppState.tasks[idx] = task; else AppState.tasks.unshift(task);
      render();
    });
    es.addEventListener("stage", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (!task) return;
      const target = task.targets[0];
      if (!target) return;
      const stage = target.stages.find(s => s.stage_id === ev.stage_id);
      if (stage) { stage.status = ev.status; if (ev.output) stage.output = ev.output; }
      if (ev.status === "running" && AppState.selectedTaskId === taskId && AppState.selectedStageId === null) {
        AppState.selectedStageId = null;
      }
      render();
      document.getElementById(`stage-${ev.stage_id}`)?.scrollIntoView({ behavior:"smooth", block:"nearest" });
    });
    es.addEventListener("result", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (!task) return;
      const target = task.targets[ev.target_index];
      if (target) Object.assign(target, { score:ev.score, vulnerabilities:ev.results, readme:ev.readme, status:"completed" });
      render();
    });
    es.addEventListener("done", e => {
      const ev = JSON.parse(e.data);
      const task = AppState.tasks.find(t => t.id === taskId);
      if (task) task.status = ev.status;
      es.close(); AppState.eventSource = null;
      render();
    });
    es.onerror = () => {
      es.close();
      if (retries < 3) { retries++; setTimeout(connect, 3000); }
    };
  }
  connect();
}

async function abortTask(id) {
  if (!confirm("Abort this scan task?")) return;
  if (AppState.eventSource) { AppState.eventSource.close(); AppState.eventSource = null; }
  // Immediately patch local state for instant visual feedback
  const task = AppState.tasks.find(t => t.id === id);
  if (task) {
    task.status = "failed";
    task.targets?.forEach(target => {
      target.stages?.forEach(s => {
        if (s.status === "running" || s.status === "pending") s.status = "error";
      });
    });
    render();
  }
  try {
    await fetch(`/api/tasks/${id}`, { method:"DELETE" });
    await loadTasks();
  } catch(e) {
    render();
  }
}

async function deleteTask(id) {
  if (!confirm("Delete this task and all its data? This cannot be undone.")) return;
  if (AppState.eventSource && AppState.selectedTaskId === id) {
    AppState.eventSource.close();
    AppState.eventSource = null;
  }
  AppState.tasks = AppState.tasks.filter(t => t.id !== id);
  if (AppState.selectedTaskId === id) AppState.selectedTaskId = null;
  render();
  try {
    await fetch(`/api/tasks/${id}/record`, { method: "DELETE" });
  } catch(e) {
    await loadTasks();
  }
}

// ── Load data ──
async function loadTasks() {
  try {
    const res = await fetch("/api/tasks");
    if (!res.ok) return;
    AppState.tasks = await res.json();
    render();
  } catch(e) { /* backend not available in Phase 1 */ }
}

async function loadSavedConfigs() {
  try {
    const r = await fetch("/api/configs");
    AppState.savedConfigs = r.ok ? await r.json() : [];
  } catch(e) { AppState.savedConfigs = []; }
}

async function saveConfig() {
  const name = prompt("Config name:", AppState.configForm.url || "New Config");
  if (!name) return;
  const form = AppState.configForm;
  await fetch("/api/configs", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name,
      url: form.url,
      stage_ids: form.stage_ids.length < ALL_STAGE_IDS.length ? form.stage_ids : null,
      prompt: form.prompt,
      language: form.language,
      llm_profile_id: AppState.selectedLlmProfileId || null,
      oauth_client_id: form.oauth_client_id || null,
      oauth_client_secret: form.oauth_client_secret || null,
      oauth_token_url: form.oauth_token_url || null,
      oauth_scope: form.oauth_scope || null,
    })
  });
  await loadSavedConfigs();
  render();
}

function applyConfig(cfg) {
  const stageIds = cfg.stage_ids ? JSON.parse(cfg.stage_ids) : [...ALL_STAGE_IDS];
  AppState.configForm = {
    url: cfg.url || "",
    stage_ids: stageIds,
    stagesOpen: false,
    prompt: cfg.prompt || "",
    language: cfg.language || "zh",
    oauth_client_id: cfg.oauth_client_id || "",
    oauth_client_secret: cfg.oauth_client_secret || "",
    oauth_token_url: cfg.oauth_token_url || "",
    oauth_scope: cfg.oauth_scope || "",
  };
  if (cfg.llm_profile_id) {
    const match = AppState.llmProfiles.find(p => p.id === cfg.llm_profile_id);
    if (match) AppState.selectedLlmProfileId = match.id;
  }
  AppState.selectedTaskId = null;
  render();
}

async function deleteSavedConfig(id) {
  await fetch(`/api/configs/${id}`, { method: "DELETE" });
  await loadSavedConfigs();
  render();
}

async function loadLlmProfiles() {
  try {
    const res = await fetch("/api/llm-profiles");
    if (!res.ok) return;
    const profiles = await res.json();
    AppState.llmProfiles = profiles;
    // Keep current selection only if it exists in the real backend profile list;
    // otherwise fall back to default (or first). This prevents the mock "llm-1"
    // ID from persisting and causing a "profile not found" 404 on scan start.
    const currentValid = profiles.find(p => p.id === AppState.selectedLlmProfileId);
    if (!currentValid) {
      const def = profiles.find(p => p.is_default);
      AppState.selectedLlmProfileId = def?.id || profiles[0]?.id || null;
    }
    render();
  } catch(e) { /* backend not available */ }
}

// ── LLM Modal actions ──
function openLlmModal() {
  AppState.showLlmModal = true;
  AppState.llmFormOpen = false;
  AppState.editingProfileId = null;
  AppState.llmForm = { name:"", base_url:"https://openrouter.ai/api/v1", api_key:"", model:"", is_default:false };
  render();
}

function closeLlmModal() {
  AppState.showLlmModal = false;
  AppState.llmFormOpen = false;
  render();
}

function editLlmProfile(id) {
  const p = AppState.llmProfiles.find(p => p.id === id);
  if (!p) return;
  AppState.editingProfileId = id;
  AppState.llmFormOpen = true;
  AppState.llmForm = { name:p.name, base_url:p.base_url, api_key:"", model:p.model, is_default:p.is_default };
  renderLlmModal();
}

function cancelLlmForm() {
  AppState.llmFormOpen = false;
  AppState.editingProfileId = null;
  renderLlmModal();
}

async function saveLlmProfile() {
  const f = AppState.llmForm;
  if (!f.name || !f.base_url || !f.model) { alert("Name, API URL, and Model are required"); return; }
  if (!AppState.editingProfileId && !f.api_key) { alert("API Key is required"); return; }

  const body = { name:f.name, base_url:f.base_url, model:f.model, is_default:f.is_default };
  if (f.api_key) body.api_key = f.api_key;

  try {
    let res;
    if (AppState.editingProfileId) {
      res = await fetch(`/api/llm-profiles/${AppState.editingProfileId}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    } else {
      if (!f.api_key) { alert("API Key is required"); return; }
      body.api_key = f.api_key;
      res = await fetch("/api/llm-profiles", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    }
    if (!res.ok) { const e = await res.json(); alert("Save failed: " + (e.detail || res.status)); return; }
    await loadLlmProfiles();
    closeLlmModal();
  } catch(e) {
    // Mock: add locally for Phase 1 testing
    const id = "llm-" + Date.now();
    const newP = { id, ...body, created_at: new Date().toISOString() };
    if (f.is_default) AppState.llmProfiles.forEach(p => p.is_default = false);
    AppState.llmProfiles.push(newP);
    if (!AppState.selectedLlmProfileId || f.is_default) AppState.selectedLlmProfileId = id;
    closeLlmModal();
  }
}

function confirmDeleteLlm(id) {
  const p = AppState.llmProfiles.find(p => p.id === id);
  if (!p) return;
  if (!confirm(`Delete "${p.name}"?`)) return;
  deleteLlmProfile(id);
}

async function deleteLlmProfile(id) {
  try {
    await fetch(`/api/llm-profiles/${id}`, { method:"DELETE" });
    await loadLlmProfiles();
  } catch(e) {
    AppState.llmProfiles = AppState.llmProfiles.filter(p => p.id !== id);
    if (AppState.selectedLlmProfileId === id) AppState.selectedLlmProfileId = AppState.llmProfiles[0]?.id || null;
    renderLlmModal();
    render();
  }
}

// ── Export / Import ──
function exportConfig() {
  const form = AppState.configForm;
  const profile = AppState.llmProfiles.find(p => p.id === AppState.selectedLlmProfileId);
  const data = {
    version: 2,
    llm_profile_name: profile?.name || null,
    url: form.url,
    stage_ids: form.stage_ids.length < ALL_STAGE_IDS.length ? form.stage_ids : null,
    prompt: form.prompt,
    language: form.language,
    oauth_client_id: form.oauth_client_id || null,
    oauth_client_secret: form.oauth_client_secret || null,
    oauth_token_url: form.oauth_token_url || null,
    oauth_scope: form.oauth_scope || null,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `mcp-scan-config-${today}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importConfig() { document.getElementById("import-input").click(); }

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      let url = "", stage_ids = [...ALL_STAGE_IDS];
      if (data.version === 2) {
        // New single-URL format
        url = data.url || "";
        stage_ids = data.stage_ids || [...ALL_STAGE_IDS];
      } else if (data.version === 1 && Array.isArray(data.targets) && data.targets.length > 0) {
        // Backward compat: take first target
        url = data.targets[0].url || "";
        stage_ids = data.targets[0].stage_ids || [...ALL_STAGE_IDS];
      } else {
        alert("Invalid configuration file format"); return;
      }
      AppState.configForm = {
        url,
        stage_ids,
        stagesOpen: false,
        prompt: data.prompt || "",
        language: data.language || "zh",
        oauth_client_id: data.oauth_client_id || "",
        oauth_client_secret: data.oauth_client_secret || "",
        oauth_token_url: data.oauth_token_url || "",
        oauth_scope: data.oauth_scope || "",
      };
      // Match LLM profile by name
      if (data.llm_profile_name) {
        const match = AppState.llmProfiles.find(p => p.name.toLowerCase() === data.llm_profile_name.toLowerCase());
        if (match) {
          AppState.selectedLlmProfileId = match.id;
        } else {
          setTimeout(() => alert(`LLM service "${data.llm_profile_name}" not found — please select one manually`), 100);
        }
      }
      AppState.selectedTaskId = null;
      AppState.panelOpen.targets = true;
      render();
    } catch(err) { alert("Failed to parse configuration file: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
window.addEventListener("DOMContentLoaded", async () => {
  // Initialize with mock data for Phase 1 standalone testing
  initMockData();
  render();

  // Try to load real data from backend (will silently fail if not running)
  await Promise.all([loadTasks(), loadLlmProfiles(), loadSavedConfigs()]);

  // Auto-connect SSE for any running task
  const running = AppState.tasks.find(t => t.status === "running");
  if (running && AppState.selectedTaskId === running.id) connectToTask(running.id);
});
</script>
